<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AQI Prediction</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/dashboard.css') }}">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="main-content">

<h1>AQI Prediction</h1>

<form action="/aqi_prediction" method="POST">

<div class="cards">

<div class="card">

<label>PM2.5</label>

<input
type="number"
step="0.01"
name="pm25"
required>

</div>

<div class="card">

<label>PM10</label>

<input
type="number"
step="0.01"
name="pm10"
required>

</div>

<div class="card">

<label>CO</label>

<input
type="number"
step="0.01"
name="co"
required>

</div>

<div class="card">

<label>NO₂</label>

<input
type="number"
step="0.01"
name="no2"
required>

</div>

<div class="card">

<label>SO₂</label>

<input
type="number"
step="0.01"
name="so2"
required>

</div>

<div class="card">

<label>O₃</label>

<input
type="number"
step="0.01"
name="o3"
required>

</div>

<div class="card">

<label>Temperature</label>

<input
type="number"
step="0.01"
name="temperature"
required>

</div>

<div class="card">

<label>Humidity</label>

<input
type="number"
step="0.01"
name="humidity"
required>

</div>

</div>

<br>

<button type="submit">

Predict AQI

</button>

</form>

{% if prediction %}

<div class="card" style="margin-top:30px;">

<h2>Prediction Result</h2>

<h3>AQI : {{ prediction }}</h3>

<h3>Category : {{ category }}</h3>

</div>

{% endif %}

</div>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>

</html>
